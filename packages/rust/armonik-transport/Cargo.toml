[package]
name = "armonik-transport"
description = "Transport layer (configuration, TLS/mTLS) for the ArmoniK Rust client"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
include = ["**/*.rs", "Cargo.toml", "README.md"]

[features]
serde = ["dep:serde"]

[dependencies]
# `channel` for `tonic::transport::Endpoint`, which is what `connect` builds; `codegen` for the
# `http`/`tokio_stream` re-exports a dependent reaches through this crate.
tonic = { workspace = true, features = ["channel", "codegen"] }
snafu.workspace = true
tracing.workspace = true
h2 = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# `tokio` for `TokioIo`, which is what puts a `TcpStream` in the shape hyper reads and writes.
# `client-legacy` for `HttpConnector`, which is the dial: resolution, the per-address loop
# and the socket options, with the address families raced rather than tried in turn.
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "http1",
  "tokio",
] }
http.workspace = true
# `BodyExt::frame`, to read a response body one frame at a time rather than collecting it.
http-body-util.workspace = true
bytes.workspace = true
# gRPC stores a `-bin` metadata value base64-encoded on the wire.
base64.workspace = true
# The gRPC engine spawns: a task per HTTP/2 session, a task per call. `macros` is `select!`, which
# is how a call watches for its own cancellation while it waits on the network.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# The connector is a `tower` service, which is the seam a TLS or proxy connector slots into.
tower-service.workspace = true
hyper-rustls = { workspace = true, features = [
  "http1",
  "http2",
  "native-tokio",
  "tls12",
  "logging",
] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
serde = { workspace = true, optional = true }
humantime.workspace = true

[dev-dependencies]
# The boolean options are read straight from the environment, so testing which spellings they accept
# means setting variables: process-global state, hence one test at a time.
serial_test.workspace = true
# Only to round-trip `ClientConfigArgs` in the test that pins the `serde` feature.
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time"] }
# The integration tests serve a gRPC service to call, which the regular build never does; these features
# union with the `channel`/`codegen` above for test builds only.
tonic = { workspace = true, features = ["server", "router"] }
# The gRPC integration tests run their own accept loop, so they serve HTTP/2 themselves rather
# than through `tonic::transport::Server`; that is what lets them count connections.
hyper = { workspace = true, features = ["server"] }

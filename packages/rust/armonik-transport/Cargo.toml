[package]
name = "armonik-transport"
description = "Transport layer (configuration, TLS/mTLS) for the ArmoniK Rust client"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# The schema is committed rather than generated, and a test reads it with `include_str!`, so an
# archive without it is one whose own tests do not compile.
include = [
  "**/*.rs",
  "Cargo.toml",
  "README.md",
  "options.schema.json",
  "runtime.schema.json",
  "tests/configuration.json",
]

[features]
# A JSON schema of the option vocabulary, for generating an options class in another language.
schema = ["dep:schemars"]
# Points where a test runs its own code inside the engine, and a count of what it writes. Off
# unless a test asks for it; no shipped build enables it.
test-hooks = []

# Skipped without the feature: run it with `--features test-hooks`, or `--all-features`.
[[test]]
name = "panics"
required-features = ["test-hooks"]

# Compiled by the build against h2-batch's patch only; it counts writes with the test hooks.
[[test]]
name = "h2_batch"
required-features = ["test-hooks"]

[dependencies]
# `codegen` for tonic's client, which carries the engine's gRPC framing, and for the
# `http`/`tokio_stream` re-exports a dependent reaches through this crate. `gzip` for its decoder,
# which inflates a response's compressed messages within the channel's receive limit.
tonic = { workspace = true, features = ["codegen", "gzip"] }
snafu.workspace = true
tracing.workspace = true
h2 = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# `tokio` for `TokioIo`, which is what puts a `TcpStream` in the shape hyper reads and writes.
# `client-legacy` for `HttpConnector`, which is the dial: resolution, the per-address loop
# and the socket options, with the address families raced rather than tried in turn.
# `client-proxy` for `Tunnel`, the `CONNECT` handshake a proxied dial is.
hyper-util = { workspace = true, features = [
  "client",
  "client-legacy",
  "client-proxy",
  "http1",
  "tokio",
] }
http.workspace = true
# `BodyExt::frame`, to read a response body one frame at a time rather than collecting it, and
# `Full`, the body of a request framed whole.
http-body-util.workspace = true
bytes.workspace = true
# Compresses the messages a call sends when the channel is set to; tonic's own encoder is out of
# the path, the engine framing its messages itself.
flate2.workspace = true
# The backoff's jitter, drawn below its bound so calls that failed together do not come back
# together.
fastrand.workspace = true
# gRPC stores a `-bin` metadata value base64-encoded on the wire.
base64.workspace = true
# The gRPC engine spawns: a task per HTTP/2 session, a task per call. `macros` is `select!`, which
# is how a call watches for its own cancellation while it waits on the network.
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
# The connector is a `tower` service, which is the seam a TLS or proxy connector slots into.
tower-service.workspace = true
hyper-rustls = { workspace = true, features = [
  "http1",
  "http2",
  "native-tokio",
  "tls12",
  "logging",
] }
rustls = { workspace = true, features = ["ring", "logging", "std", "tls12"] }
# Reads a client certificate bundled with its chain and key as a PKCS#12 file, the form Windows
# and most certificate authorities hand out; pure Rust, so it brings no OpenSSL of its own.
p12-keystore.workspace = true
# A password held so that no Debug print shows it and it is zeroed when dropped, with `serde` so
# it deserialises with the rest of the options.
secrecy = { workspace = true, features = ["serde"] }
# A proxy URL's `user:password@`, which escapes what the URL syntax reserves.
percent-encoding.workspace = true
serde.workspace = true
schemars = { workspace = true, optional = true }
# `float_roundtrip`, so a number reads back as the double the host wrote: the default parse may
# land an ulp away, and at a bound an ulp is a refusal. .NET Framework writes 1e-9 with
# seventeen digits.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# The configuration loader's file formats beside JSON. `parse` and `serde` are what read a file
# into a table; YAML without `encoding`, since a configuration file is UTF-8.
toml = { workspace = true, features = ["parse", "serde", "std"] }
yaml-rust2.workspace = true

# The schema is what the options type exists to produce, so an example prints it - and it only
# builds where `schemars` does.
[[example]]
name = "schema"
required-features = ["schema"]

[[example]]
name = "runtime_schema"
required-features = ["schema"]

# The Windows certificate store, which a client identity and a root may be resolved from, and
# the reader of a certificate's subject and issuer that matching and chain-building need.
[target.'cfg(windows)'.dependencies]
schannel.workspace = true
# `verify`: an issuer is the certificate whose key signed the one below it, which the subject
# alone does not settle when a store holds an intermediate and its renewal.
x509-parser = { workspace = true, features = ["verify"] }
# The proxy the user's network settings name, found and run by WinHTTP.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
# The proxy tests set the process's environment and the panic tests its hook: process-global
# state, hence one test at a time.
serial_test.workspace = true
# The server-streaming fixture answers a stream of messages, and tonic asks for a `Stream` to
# build it from; the regular build never produces one.
futures.workspace = true
# What the configuration loader logs, read back by its tests.
tracing-subscriber = { workspace = true, features = ["fmt"] }
# `io-util` for the tests that write HTTP/2 frames by hand.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "time", "io-util"] }
# The integration tests serve a gRPC service to call, which the regular build never does; these features
# union with the `codegen` above for test builds only.
tonic = { workspace = true, features = ["server", "router"] }
# The gRPC integration tests run their own accept loop, so they serve HTTP/2 themselves rather
# than through `tonic::transport::Server`; that is what lets them count connections.
hyper = { workspace = true, features = ["server"] }
# The TLS tests serve over a certificate made for the run, from a CA made for the run, so no key
# is committed and none expires.
rcgen = { workspace = true, features = ["crypto", "pem", "ring"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

language = "C"
header = """
/*
 * ArmoniK transport C ABI — GENERATED, DO NOT EDIT.
 *
 * Regenerated by `build.rs` (cbindgen) on every build of `armonik-transport-ffi`, and committed so
 * that an ABI change shows up in review rather than only in the compiled library. Edit the Rust
 * sources, not this file.
 *
 * Conventions that the signatures alone do not convey:
 *
 *  - Result codes. 0 is success. A positive value is a gRPC status code. A negative value is local
 *    to this library; see the AK_* constants.
 *
 *  - `ak_bytes` is owned by the caller once returned and must be released with exactly one
 *    `ak_bytes_free`, passing the value back unchanged. `ptr`/`len` are a read-only view; `owner` is
 *    opaque and must never be dereferenced. The zeroed value means "no data" and is always safe to
 *    free.
 *
 *  - `ak_bytes_in` is the reverse: a view into memory the *caller* owns, borrowed for the duration
 *    of the call and never freed by this library. A null pointer or zero length means "absent".
 *
 *  - Key/value blobs (client options, gRPC metadata) are encoded as:
 *        uint32 count, then `count` times { uint32 key_len, key bytes, uint32 value_len, value bytes }
 *    Integers are in NATIVE byte order: this is an in-process ABI, not a wire format.
 *
 *  - `ak_call_wait_handle` returns a BORROWED Win32 event handle, owned by this library and valid
 *    for exactly as long as its `ak_call`. Never close it. On .NET, wrap it as
 *    `new SafeWaitHandle(handle, ownsHandle: false)`. It is an auto-reset event, and a signal means
 *    "poll again", not "exactly one thing changed": always drain `ak_call_try_recv` until it reports
 *    pending or completed.
 */
"""
include_guard = "ARMONIK_TRANSPORT_FFI_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

[parse]
parse_deps = false

[enum]
prefix_with_name = true

# The status constants are namespaced by their module in Rust (`status::OK`), but a C header has no
# modules: emitting `#define OK 0` would collide with half the world. Renamed here rather than in the
# Rust source so the Rust side stays `status::OK` instead of `status::AK_OK`.
#
# `tests/header.rs` fails if a constant ever reaches the header without the `AK_` prefix, so a new
# status cannot silently escape this table.
[export.rename]
"OK" = "AK_OK"
"NULL_ARGUMENT" = "AK_NULL_ARGUMENT"
"INVALID_UTF8" = "AK_INVALID_UTF8"
"INVALID_CONFIG" = "AK_INVALID_CONFIG"
"CONNECTION_FAILED" = "AK_CONNECTION_FAILED"
"INVALID_HANDLE" = "AK_INVALID_HANDLE"
"INVALID_STATE" = "AK_INVALID_STATE"
"WOULD_BLOCK" = "AK_WOULD_BLOCK"
"INTERNAL" = "AK_INTERNAL"
"INTERNAL_PANIC" = "AK_INTERNAL_PANIC"

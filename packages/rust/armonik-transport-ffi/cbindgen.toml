language = "C"
header = """
/*
 * ArmoniK transport C ABI - GENERATED, DO NOT EDIT.
 *
 * Regenerated by `build.rs` (cbindgen) on every build of `armonik-transport-ffi`, and committed so
 * that an ABI change shows up in review rather than only in the compiled library. Edit the Rust
 * sources, not this file.
 *
 * This is an HTTP/2 transport, not a gRPC stack. It opens a request, streams bytes both ways, and
 * reports headers, data and trailers. Message framing, `grpc-status`, deadlines and retry belong to
 * whatever speaks gRPC above it.
 *
 * Conventions that the signatures alone do not convey:
 *
 *  - Result codes. 0 is success, everything else is negative; see the AK_* constants. There is no
 *    positive space: no gRPC status is reported at this level.
 *
 *  - The reactor. One event callback per request, and three rules:
 *      1. Nothing arrives unarmed. `ak_request_read` arms one read and produces exactly one event
 *         (AK_EVENT_READ_DONE, or AK_EVENT_COMPLETED); `ak_request_write` arms one write and
 *         produces AK_EVENT_WRITE_DONE. At most one read and one write may be armed at a time.
 *      2. AK_EVENT_COMPLETED arrives exactly once, and last. If `ak_request_start` returned AK_OK it
 *         always arrives, cancellation and connection failure included; if `ak_request_start`
 *         failed, no event ever arrives. Anything still armed is resolved by it. Nothing is called
 *         back afterwards, so that is where the caller releases whatever it rooted for `ctx`.
 *      3. No callback happens during an inbound call. Every function posts a command and returns;
 *         events are emitted from this library's own threads, serialised per request. A caller
 *         needs no lock of its own, but its callback runs on a foreign thread: it must not block,
 *         must not raise, and must not re-enter this library for the same request.
 *
 *  - Handles are thread-safe. An `ak_client` or `ak_request` may be used from any thread and from
 *    several at once, `_free` included: a call already under way when another thread frees the
 *    handle finishes normally. What is not allowed is using a handle after its own `_free` has
 *    returned.
 *
 *  - `ak_request_free` is synchronous with respect to the event callback. When it returns, no
 *    callback for that request is running or will start, so that is a safe moment to release
 *    whatever `ctx` pointed at. It is therefore the one call a callback must never make for its own
 *    request: it would wait for itself. `ak_client_create` is the other, for an unrelated reason
 *    given in its own documentation.
 *
 *  - Event payloads are BORROWED for the duration of the callback. Copy what is needed before
 *    returning; never free one. Nothing on the event path is owned by the caller.
 *
 *  - `ak_bytes` is the opposite, and only ever comes back through a synchronous out-parameter: it is
 *    owned by the caller and must be released with exactly one `ak_bytes_free`, passing the value
 *    back unchanged. `ptr`/`len` are a read-only view; `owner` is opaque, so never dereference it.
 *    The zeroed value means "no data" and is always safe to free.
 *
 *  - `ak_bytes_in` is a view into memory this library does not own, borrowed for the duration of the
 *    call. A null pointer or zero length means "absent".
 *
 *  - Key/value blobs (request headers, response headers, trailers) are encoded as:
 *        uint32 count, then `count` times { uint32 key_len, key bytes, uint32 value_len, value bytes }
 *    Integers are in NATIVE byte order: this is an in-process ABI, not a wire format. Keys may
 *    repeat and are kept in order. Values are opaque bytes; a `-bin` header's base64 is the caller's
 *    convention and passes through untouched.
 */
"""
include_guard = "ARMONIK_TRANSPORT_FFI_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

[parse]
parse_deps = false

[enum]
prefix_with_name = true

# The constants are namespaced by their module in Rust (`status::OK`, `event::COMPLETED`), but a C
# header has no modules: emitting `#define OK 0` would collide with half the world. Renamed here
# rather than in the Rust source so the Rust side stays `status::OK` instead of `status::AK_OK`.
#
# `tests/header.rs` fails if a constant ever reaches the header without the `AK_` prefix, so a new
# status or event cannot silently escape this table.
[export.rename]
"OK" = "AK_OK"
"NULL_ARGUMENT" = "AK_NULL_ARGUMENT"
"INVALID_UTF8" = "AK_INVALID_UTF8"
"INVALID_CONFIG" = "AK_INVALID_CONFIG"
"CONNECTION_FAILED" = "AK_CONNECTION_FAILED"
"INVALID_HANDLE" = "AK_INVALID_HANDLE"
"INVALID_STATE" = "AK_INVALID_STATE"
"INTERNAL" = "AK_INTERNAL"
"INTERNAL_PANIC" = "AK_INTERNAL_PANIC"
"CANCELLED" = "AK_CANCELLED"
"TIMEOUT" = "AK_TIMEOUT"
"TRANSPORT" = "AK_TRANSPORT"
"RESPONSE_HEADERS" = "AK_EVENT_RESPONSE_HEADERS"
"WRITE_DONE" = "AK_EVENT_WRITE_DONE"
"READ_DONE" = "AK_EVENT_READ_DONE"
"COMPLETED" = "AK_EVENT_COMPLETED"

# How include/armonik_transport_ffi.h is rendered from src/abi.rs and src/lib.rs, by
# armonik-transport-ffi-bindgen. The header is committed, and that crate's test and the .NET
# build fail when it is not what these render; write it again with
#   cargo run -p armonik-transport-ffi-bindgen

language = "C"
include_guard = "ARMONIK_TRANSPORT_FFI_H"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
# `typedef struct { ... } name;`, so a declaration names `ak_bytes` rather than `struct ak_bytes`.
style = "type"
documentation_style = "doxy"
line_length = 100
tab_width = 4

header = """
/* C ABI over the ArmoniK Rust gRPC engine.
 *
 * Generated by cbindgen from the Rust declarations in armonik-transport-ffi (src/abi.rs and
 * src/lib.rs) and committed. Edits here are lost: change the Rust, then write this again with
 * `cargo run -p armonik-transport-ffi-bindgen`. The build fails while the two differ.
 * `spec/armonik_grpc_ffi/abi.md` carries the reasoning; this carries the contract.
 *
 * Two rules run through all of it:
 *
 *   - A handle is a token, not a pointer. It names one object and is never handed out twice, so
 *     a downcall on something the runtime has reclaimed reports AK_STATUS_HANDLE_STALE instead of
 *     faulting - and so does one on an object of another kind.
 *   - Memory crosses in one direction at a time. What the library hands over, the host gives
 *     back exactly once - a payload through ak_event_consumed, a lent buffer through
 *     ak_call_send_message or ak_return_call_buffer, and the buffer ak_resize_call_buffer hands
 *     back in its place counts as the one owed - and the runtime cannot finish until it has.
 *     Exactly once is the host's to keep: unlike a handle, the owner in ak_bytes and ak_buffer is
 *     a pointer, so giving one back twice reads memory this library has freed. Undefined
 *     behaviour, not a refusal - there is nothing left to refuse with.
 *
 * Every entry point that can refuse takes ak_error *out_error as its last argument, which may be
 * NULL. On a refusal, and only then, a non-NULL out_error receives the refusal's family and its
 * message, which the host gives back through ak_error_release. A NULL out_error gets the status
 * alone, and no message is built for it.
 *
 * Every options struct starts with struct_size, which the host sets to sizeof of its own
 * definition, then version, flags and reserved, which it sets to zero. A struct_size smaller than
 * this library's definition is refused with AK_STATUS_INVALID_ARG rather than read; a larger one
 * is read up to this library's definition and the rest ignored, so a field appended to the end
 * is an addition rather than a break. A version, a flag or a reserved field that is not zero is
 * refused with AK_STATUS_INVALID_ARG.
 *
 * Metadata travels as a blob:
 *
 *     uint32_t count
 *     repeated count times {
 *         uint32_t key_len;   key_len bytes
 *         uint32_t value_len; value_len bytes
 *     }
 *
 * A key ending in "-bin" carries raw bytes; every other value is printable ASCII. An empty blob
 * and a blob of count zero mean the same thing.
 *
 * The AK_EVENT_STATUS payload is:
 *
 *     uint32_t message_len; message_len bytes    the reason, UTF-8
 *     the trailing metadata, as a blob
 *
 * The status code itself is ak_event.status_code, not part of the payload.
 *
 * Integers in the blobs are in native byte order. This ABI runs in-process between this library
 * and its host; it is not a wire format.
 */"""

[export]
# Named by no signature, or only through the callback, and part of the contract all the same.
include = ["ak_event", "ak_event_kind", "ak_head_origin", "ak_host_debt", "ak_source_kind"]

[package]
name = "armonik-transport-ffi"
description = "C ABI over armonik-transport's gRPC engine, for hosts that cannot link Rust"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
version.workspace = true

# `cdylib` is what a host application loads; `lib` is what the integration tests link against.
[lib]
crate-type = ["lib", "cdylib"]
name = "armonik_transport_ffi"

[dependencies]
# By path: this crate is never published, and the two move together.
# `serde` for the options type the channel document is read into: the vocabulary is declared
# once, beside the engine that honours it, and this crate reads rather than restates it.
armonik-transport = { path = "../armonik-transport", features = ["serde"] }
bytes.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
# Points where a test holds a host thread inside a downcall. Off unless a test asks for it; no
# shipped build enables it.
test-hooks = []

# Skipped without the feature: run it with `--features test-hooks`, or `--all-features`.
[[test]]
name = "races"
required-features = ["test-hooks"]

[dev-dependencies]
# The same crate again, with the schema turned on: one test reads the bounds the schema states
# and drives `config::parse` at each of them, which is what keeps the reader's copy honest.
armonik-transport = { path = "../armonik-transport", features = ["serde", "schema"] }
# The tests include armonik-transport's gRPC fixture by path, and its server-streaming service
# answers with a `Stream`.
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tonic = { workspace = true, features = ["codegen", "server", "router"] }
tower-service.workspace = true
hyper = { workspace = true, features = ["server", "http2"] }
http.workspace = true

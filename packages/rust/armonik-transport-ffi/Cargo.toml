[package]
name = "armonik-transport-ffi"
description = "C ABI over armonik-transport, for host applications that cannot link Rust directly"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# Nothing outside this workspace consumes this crate, and its ABI is not a contract anyone has been
# offered yet.
publish = false
include = ["**/*.rs", "Cargo.toml", "*.md", "cbindgen.toml", "include/*"]

# Both are needed: `cdylib` is what a host application loads, `lib` is what the tests link against.
[lib]
crate-type = ["lib", "cdylib"]
name = "armonik_transport_ffi"

[features]
# Keep the locations that errors carry in the message that crosses the ABI: the ` [file.rs:12:34]`
# of a Rust source, and the ` at line 1 column 56` position `serde_json` names in the configuration
# document.
#
# Off by default, and that is a disclosure rule rather than a matter of taste: a released build says
# what went wrong, never whereabouts in the source it happened. Being open source changes nothing -
# what someone can find by reading a repository is not what a library volunteers in a log. What the
# messages say stays the same either way; only the coordinates go.
#
# Compile-time rather than a configuration option, so a released library carries neither the branch
# nor the choice. The ABI is the same either way, so the two builds are interchangeable and a
# consumer picks one by which library it ships.
error-locations = []

[dependencies]
# The whole connection layer - options, TLS, mTLS, proxy - comes from here, and its errors are what
# the ABI's configuration and connection statuses report. Depending on this rather than on `armonik`
# keeps protobuf codegen, and the `protoc` it would need, out of this crate's build entirely.
# `serde` because the configuration crosses the ABI as a JSON document, and that feature is what
# reads one. Everything else this crate builds on - `http`, `hyper_util`, `http_body_util` - comes
# through that crate's `reexports`, so there is one version of each in the build rather than two.
armonik-transport = { workspace = true, features = ["serde"] }
# Reads the configuration document. The transport declares the vocabulary and the `serde` half that
# parses it; naming the format is this crate's business, because the format is part of its ABI.
serde_json.workspace = true
# One process-wide runtime for the work the ABI hands off. `rt-multi-thread` is the runtime itself;
# nothing here drives I/O directly. `time` and `sync` are what the rate limiter waits on: a sleep,
# and a mutex a waiter may hold across one; `sync` is also the command channel a request is driven
# through. `macros` for `select!`, which is the driving loop itself.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# `Bytes` is what an owned buffer handed across the ABI is built on: it may be a refcounted view
# into a larger allocation, so a buffer this crate already holds crosses without being copied.
bytes.workspace = true
# Declared for one feature, and still reached through `armonik_transport::reexports` in the source,
# so that one version of `Body` is in the build rather than two. `channel` is off in the transport
# deliberately - it costs a `tokio` edge and belongs to whoever feeds a request body - and features
# are additive, so turning it on here turns it on for that same crate. This crate is that consumer:
# `channel::Channel` is the queue a caller's chunks reach the connection through.
http-body-util = { workspace = true, features = ["channel"] }

[dev-dependencies]
# `schema` so that the committed `include/http_config.schema.json` can be regenerated and compared.
# The artefact is generated from the transport's own types, so this crate's build script has no way
# to write it; a test is what makes a change to the vocabulary show up as a diff.
armonik-transport = { workspace = true, features = ["schema"] }
# A certificate and a key that do not belong together, generated fresh: the one configuration that
# makes assembling the TLS stack fail, and so the one that proves a TLS failure reaches the caller
# with its cause rather than as a summary. A committed fixture would also have to keep unexpired.
rcgen.workspace = true
# `test-util` for a paused clock: it lets a rate limit be asserted on what it waited *for* rather
# than on how long a test took, and `tokio` only advances a paused clock once every task is parked,
# which is precisely the case a limiter that blocked its thread would hang in. `net` and `macros`
# for the test server, which listens on loopback and spawns a task per call.
tokio = { workspace = true, features = ["macros", "net", "test-util"] }
# The tests serve a gRPC service to call. `armonik` is deliberately absent: its protobuf codegen has
# nothing to do with a transport-level ABI, and the test service speaks the same opaque bytes this
# crate does. `server` for the handler machinery, `router` for the one service it is served through.
tonic = { workspace = true, features = ["router", "server"] }
# The test service is a `tower` service, which is what `tonic` serves.
tower-service.workspace = true
# `Stream`, which is what a `tonic` handler returns its responses as, and `stream::iter` for a
# handler whose replies are all known before the first one goes out.
futures.workspace = true

[build-dependencies]
cbindgen.workspace = true
csbindgen.workspace = true

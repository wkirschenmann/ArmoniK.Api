[package]
authors.workspace = true
description = "Rust bindings for the ArmoniK API"
edition.workspace = true
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md", "protos/**"]
license.workspace = true
readme = "README.md"
name = "armonik"
repository.workspace = true
version.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client"]
serde = ["dep:serde", "armonik-transport?/serde"]
client = ["_gen-client"]
server = ["_gen-server"]
agent = ["_gen-client", "_gen-server"]
worker = ["_gen-client", "_gen-server"]
_gen-client = ["dep:armonik-transport", "armonik-transport/configuration", "dep:tokio"]
_gen-server = ["tonic/server", "tonic/router", "dep:tokio"]

[dependencies]
# TLS, mTLS and the rest of the connection story live in `armonik-transport`; this crate keeps the
# services and the generated types.
armonik-transport = { workspace = true, optional = true }
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true
futures.workspace = true
snafu.workspace = true
tracing.workspace = true
tracing-futures = { workspace = true, features = ["futures-03"] }
# `rt`: a call that streams requests sends them from a task of its own.
tokio = { workspace = true, optional = true, features = ["rt"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
# `client` and `http1` for the `get_nb_request` test helper, which drives a raw HTTP request through
# the connector `armonik-transport` builds to read the mock server's `/calls.json`; `server`,
# `http2`, `service` and `tokio` for the loopback server the integration tests' clients reach.
hyper = { workspace = true, features = ["client", "http1", "server", "http2"] }
hyper-util = { workspace = true, features = ["client", "http1", "server", "service", "tokio"] }
http.workspace = true
tower-service.workspace = true
eyre.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
http-body-util.workspace = true
serde_json.workspace = true
serial_test.workspace = true
async-stream.workspace = true
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
] }
tokio-util.workspace = true

[build-dependencies]
prost.workspace = true
prost-types.workspace = true
tonic-prost-build.workspace = true

[[test]]
name = "agent"
required-features = ["agent", "worker"]

[[test]]
name = "applications"
required-features = ["client", "server"]

[[test]]
name = "auth"
required-features = ["client", "server"]

[[test]]
name = "events"
required-features = ["client", "server"]

[[test]]
name = "partitions"
required-features = ["client", "server"]

[[test]]
name = "results"
required-features = ["client", "server"]

[[test]]
name = "sessions"
required-features = ["client", "server"]

[[test]]
name = "submitter"
required-features = ["client", "server"]

[[test]]
name = "tasks"
required-features = ["client", "server"]

[[test]]
name = "versions"
required-features = ["client", "server"]

[[test]]
name = "worker"
required-features = ["agent", "worker"]

[package]
authors.workspace = true
description = "Rust bindings for the ArmoniK API"
edition.workspace = true
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md", "protos/**"]
license.workspace = true
readme = "README.md"
name = "armonik"
repository.workspace = true
version.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client"]
serde = ["dep:serde", "armonik-transport?/serde"]
client = ["_gen-client"]
server = ["_gen-server"]
agent = ["_gen-client", "_gen-server"]
worker = ["_gen-client", "_gen-server"]
# TLS, mTLS, proxying, retry and the rest of the connection story live in `armonik-transport`; see
# its own crate docs. `armonik` only needs it to build a client, hence gated the same way the
# dependencies it replaced were.
_gen-client = ["tonic/channel", "dep:armonik-transport"]
_gen-server = ["tonic/server", "tonic/router", "dep:tokio"]

[dependencies]
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
snafu.workspace = true
tracing.workspace = true
tracing-futures = { workspace = true, features = ["futures-03"] }
# Re-exported unconditionally at `armonik::reexports::hyper` for downstream convenience (unchanged
# by the `armonik-transport` split). `hyper-rustls`/`rustls` moved there entirely; re-exported
# through it above in `lib.rs`.
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# By path *and* by version: a path dependency cannot be published, so `cargo publish` rewrites this
# into the version requirement below, which therefore has to name the version actually being
# released. `nr update-versions` keeps it in step; publish `armonik-transport` first.
armonik-transport = { path = "../armonik-transport", version = "3.29.2-beta-0", optional = true }
tokio = { workspace = true, optional = true }
serde = { version = "1.0", features = [
  "derive",
], default-features = false, optional = true }

[dev-dependencies]
eyre = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
http-body-util = "0.1"
serde_json = "1.0"
serial_test = "3.5"
async-stream = "0.3"
tokio = { version = "1.48", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
tokio-util = "0.7"
# Only the `#[cfg(test)]` diagnostic helper in `client/mod.rs` needs a plain HTTP client; it is
# never part of the crate's own non-test build or public API.
hyper-util = { workspace = true, features = ["client", "http1"] }

[build-dependencies]
tonic-prost-build = "0.14"

[[test]]
name = "agent"
required-features = ["agent", "worker"]

[[test]]
name = "applications"
required-features = ["client", "server"]

[[test]]
name = "auth"
required-features = ["client", "server"]

[[test]]
name = "events"
required-features = ["client", "server"]

[[test]]
name = "partitions"
required-features = ["client", "server"]

[[test]]
name = "results"
required-features = ["client", "server"]

[[test]]
name = "sessions"
required-features = ["client", "server"]

[[test]]
name = "submitter"
required-features = ["client", "server"]

[[test]]
name = "tasks"
required-features = ["client", "server"]

[[test]]
name = "versions"
required-features = ["client", "server"]

[[test]]
name = "worker"
required-features = ["agent", "worker"]

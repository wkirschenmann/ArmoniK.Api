[workspace]
resolver = "2"
members = ["armonik", "armonik-transport", "armonik-transport-ffi", "armonik-transport-ffi-bindgen"]

# Shared so that a version bump, or a change of MSRV or licence, is made once rather than drifting per
# crate. Members opt in per field with `xxx.workspace = true`.
[workspace.package]
authors = ["Florian Lemaitre <flemaitre@aneo.fr>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aneoconsulting/ArmoniK.Api"
rust-version = "1.88.0"
version = "3.29.2-beta-0"

# Every version lives here, so the two crates cannot resolve to two different `tonic`s, or two
# different `rustls`es, in one build. That matters because they hand each other types from both.
# Members list the dependency and their own features; the version comes from here.
[workspace.dependencies]
# By path and by version at once: a path dependency cannot be published, so `cargo publish` replaces
# it with the version requirement, which therefore has to name the version being released.
# `nr update-versions` keeps it in step.
armonik-transport = { path = "armonik-transport", version = "3.29.2-beta-0" }
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
# `clap` is only the command-line tool; the library is what renders.
cbindgen = { version = "0.29", default-features = false }
csbindgen = "1.9"
eyre = "0.6"
futures = "0.3"
http = "1"
http-body-util = "0.1"
humantime = "2.3.0"
# The version hyper resolves to. Direct, because a stream reset carries its reason in an
# `h2::Error` that hyper passes through as its own error's source and does not re-export: reading
# it means naming the type, and naming it means the same crate instance hyper linked. Cargo
# unifies the two while the requirements are semver-compatible, which is what
# `a_stream_the_peer_resets_carries_the_reason_it_was_reset_with` fails to prove if they ever stop
# being.
h2 = "0.4"
hyper = "1.10"
hyper-rustls = { version = "0.27", default-features = false }
hyper-util = "0.1"
p12-keystore = "0.3"
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.14", default-features = false }
rustls = { version = "0.23", default-features = false }
schemars = "1"
secrecy = "0.10"
# `std` as well as `derive`: without it `String` implements neither `Serialize` nor `Deserialize`, so
# the `serde` feature would not compile.
serde = { version = "1.0", features = ["derive", "std"], default-features = false }
serde_json = "1"
serde_path_to_error = "0.1"
serial_test = "3.5"
snafu = "0.9"
tokio = { version = "1.52", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-service = "0.3"
tracing = "0.1"
tracing-futures = "0.2"
tracing-subscriber = "0.3"

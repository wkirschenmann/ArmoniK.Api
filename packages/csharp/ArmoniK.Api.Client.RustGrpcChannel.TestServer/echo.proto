syntax = "proto3";

package armonik.transport.ffi.test;

option csharp_namespace = "ArmoniK.Api.Client.RustGrpcChannel.Tests";

message EchoRequest {
  string text = 1;
}

message EchoReply {
  string text = 1;
  string saw_metadata = 2;
}

message StreamRequest {
  int32 count = 1;
  int32 size = 2;
}

message Chunk {
  bytes data = 1;
}

service Echo {
  rpc Say (EchoRequest) returns (EchoReply);
  rpc Collect (stream EchoRequest) returns (EchoReply);
  rpc Fan (EchoRequest) returns (stream EchoReply);
  rpc Chat (stream EchoRequest) returns (stream EchoReply);
  rpc Refuse (EchoRequest) returns (EchoReply);
  rpc Never (EchoRequest) returns (EchoReply);
  // Response headers and then no message at all, so a client awaiting them proves they arrive
  // without a read rather than alongside one.
  rpc HeadOnly (EchoRequest) returns (stream EchoReply);
  rpc HeadThenChat (stream EchoRequest) returns (stream EchoReply);
  // Ends the call without reading, so a client still holding the request stream writes into a
  // call that is over.
  rpc CollectRefused (stream EchoRequest) returns (EchoReply);
  // Resets its own stream with ENHANCE_YOUR_CALM, after the response head when the text says
  // "after the head" and before it otherwise, so a client reads the reason off the RST_STREAM.
  rpc Reset (EchoRequest) returns (EchoReply);
  // `count` chunks of `size` bytes each, so a client measures what it can read rather than what
  // the server takes to build.
  rpc Stream (StreamRequest) returns (stream Chunk);
  // Reads chunks until the client ends, and answers with how many bytes they held.
  rpc Upload (stream Chunk) returns (EchoReply);
  // Answers with how many bytes the one chunk held.
  rpc UploadWhole (Chunk) returns (EchoReply);
}

\* Witness configuration: the target is stated negatively in
\* DotNetBinding_MCwitnessBudget, so the run is EXPECTED to report a violation -
\* the trace is the evidence that a cancelled parse can hold the terminal
\* slot, which is the case FinishCancelledParse's status branch exists for.
\* No DebtSurvivesToShutdown constraint here: that one prunes the paths
\* this witness needs.

INIT Init
NEXT Next

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint

\* Nothing prunes the rejection path here, so this run can also reach the
\* spent-channel quiescence that DotNetBinding_MC.cfg explains: a
\* legitimate end, and one that would otherwise be reported ahead of the
\* violation this configuration exists to produce.
CHECK_DEADLOCK FALSE

INVARIANT
    HopelessBudgetWaitUnreachable

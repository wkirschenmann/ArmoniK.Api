SPECIFICATION Spec

CONSTANTS
    Messages    = {m1, m2}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    \* Tiny on purpose: the charges multiply the state space, so a ceiling of
    \* three with unit messages is enough to exercise a refusal and its relief.
    Ceiling          = 3

\* TLC cannot resolve the instantiated L0!vars inside ENABLED.
CONSTANT l0_vars <- MC_l0_vars

\* TLC expands the per-payload fairness family over a finite index set.
CONSTANT PayloadIndices <- MC_PayloadIndices

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* Two distinct messages: the value conjuncts of the prefix invariants and
\* of the progress properties stop being vacuous.
CONSTRAINT StateConstraint

INVARIANT
    TypeOK
    AbstractSafety

PROPERTY
    AbstractSpec
    EventualTerminal
    EventualShutdown
    MCSubmitProgress
    MCDeliveryProgress
    EventualMetadata
    CancellationCompletes
    MCSendsEventuallyAcquitted
    PayloadsEventuallyConsumed
    ShutdownEventEmitted

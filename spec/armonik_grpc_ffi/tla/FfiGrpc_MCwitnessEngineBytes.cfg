\* Witness configuration: the target is stated negatively in
\* FfiGrpc_MCwitnessEngineBytes, so the run is EXPECTED to report a violation -
\* the trace is the evidence that the engine takes bytes and gives them back.

SPECIFICATION Spec

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3
    HardCeiling      = 4

\* TLC cannot resolve the instantiated L0!vars inside ENABLED.
CONSTANT l0_vars <- MC_l0_vars

CONSTANT PayloadIndices <- MC_PayloadIndices

CONSTANT MessageLength <- MC_MessageLength

CONSTRAINT StateConstraint

PROPERTY
    EngineNeverGivesBackBytes

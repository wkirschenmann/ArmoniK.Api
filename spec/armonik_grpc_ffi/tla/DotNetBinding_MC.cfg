\* Convergence configuration: INIT/NEXT rather than SPECIFICATION, so no
\* fairness formula is evaluated - what this run checks is the safety
\* invariants and, through -coverage, that every action fires at least once.

INIT Init
NEXT Next

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint

INVARIANT
    ManagedTypeOK
    MC_L1Safety
    TokenPublishedBeforeStart
    RootSurvivesCallbacks
    RuntimeRootSurvivesCallbacks
    ConsumerPhaseMatchesDispose
    RetryingCallHoldsNoBuffer
    DisposeAwaitsDestroy
    RingNeverOverflows

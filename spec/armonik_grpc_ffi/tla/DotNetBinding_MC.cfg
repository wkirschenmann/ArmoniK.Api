\* Convergence configuration: INIT/NEXT rather than SPECIFICATION, so no
\* fairness formula is evaluated - what this run checks is the safety
\* invariants and, through -coverage, that every action fires at least once.

INIT Init
NEXT Next

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1, ch2}
    RuntimeIds  = {rt1, rt2}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint

\* Two channels, both allowed to be refused, after which the runtime is
\* torn down and its root freed: the channel set is spent, a rejected
\* channel being terminal, and nothing can happen again.  That is
\* quiescence, not a stall - the finite ChannelIds set is a model bound
\* like the stream lengths above, not a property of the system.  ci/tlc.sh
\* passes -deadlock, so this states for a direct invocation what the
\* runner already assumes; SpentSystemOwesNothing is what carries the
\* content, and a genuine mid-flight stall breaks the liveness
\* configuration.
CHECK_DEADLOCK FALSE

INVARIANT
    MC_L1Safety
    ManagedSafety

SPECIFICATION Spec

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1, rt2}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}

\* TLC cannot resolve the instantiated L0!vars inside ENABLED.
CONSTANT l0_vars <- MC_l0_vars

\* TLC expands the per-payload fairness family over a finite index set.
CONSTANT PayloadIndices <- MC_PayloadIndices

\* Two runtime slots: exercises SingleRuntime, the RuntimeCreate
\* quiescence guard, the per-runtime shutdown event discipline and the
\* RemainFailed sole-active-slot stutter.
CONSTRAINT StateConstraint

INVARIANT
    TypeOK
    AbstractSafety

PROPERTY
    AbstractSpec
    EventualTerminal
    EventualShutdown
    MCSubmitProgress
    MCDeliveryProgress
    EventualMetadata
    CancellationCompletes
    MCSendsEventuallyAcquitted
    PayloadsEventuallyConsumed
    ShutdownEventEmitted

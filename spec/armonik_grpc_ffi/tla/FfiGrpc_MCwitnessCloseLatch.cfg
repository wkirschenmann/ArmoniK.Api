\* Witness configuration: the target is stated negatively in
\* FfiGrpc_MCwitnessCloseLatch, so the run is EXPECTED to report a violation -
\* the trace is the evidence that a call of a released channel may still
\* deliver a message before its task has seen the close.

SPECIFICATION Spec

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1}
    Ceiling          = 3
    HardCeiling      = 4

\* TLC cannot resolve the instantiated L0!vars inside ENABLED.
CONSTANT l0_vars <- MC_l0_vars

CONSTANT PayloadIndices <- MC_PayloadIndices

CONSTANT MessageLength <- MC_MessageLength

CONSTRAINT StateConstraint

INVARIANT
    CloseThenMessageUnreachable

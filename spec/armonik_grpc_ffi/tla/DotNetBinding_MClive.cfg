\* The liveness configuration: SPECIFICATION Spec, so the three fairness
\* tiers are in force and the managed liveness contract is actually
\* evaluated.  Its siblings run INIT/NEXT for the safety invariants and
\* the action coverage; a liveness defect - a guard that deadlocks a
\* nominal path - is invisible to them and shows up here.

SPECIFICATION Spec

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint
CONSTRAINT CallPathOnly

INVARIANT
    MC_L1Safety
    ManagedSafety

PROPERTY
    BudgetWaitEndsWhenHopeless
    CallDisposeCompletes
    ChannelDisposeCompletes
    ChannelLeaseEventuallyReleased
    ChannelConstructionCompletes
    RuntimeDisposeCompletes
    InFlightPayloadEventuallyReleased
    WaitingReaderEventuallyResolved
    PublishedCallEventuallySettled
    ReadInFlightEventuallyResolved
    PendingReadCancellationEventuallyObserved
    CancelledReadEventuallyDrainsCall
    HeadersEventuallyResolved
    StatusEventuallyResolved
    PendingWriteEventuallySettled
    CallRootEventuallyFreed
    RuntimeRootEventuallyFreed

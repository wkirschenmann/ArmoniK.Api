\* Witness configuration: the target is stated negatively in
\* DotNetBinding_MCwitnessEmptyWrite, so the run is EXPECTED to report a
\* violation - the trace is the evidence that a write of no bytes commits the
\* empty buffer and completes, the case CommitEmptyWrite exists for.

INIT Init
NEXT Next

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1}
    Ceiling          = 3
    HardCeiling      = 4
    OneRequestCalls  = {}
    OneResponseCalls = {}

CONSTANT MessageLength <- MC_EmptyMessageLength

\* TLC enumerates the received pairs over a finite index set.
CONSTANT PayloadIndices <- [FfiGrpc] MC_PayloadIndices

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint

\* The spent-channel quiescence DotNetBinding_MC.cfg explains is a
\* legitimate end, which would otherwise be reported ahead of the violation.
CHECK_DEADLOCK FALSE

INVARIANT
    EmptyWriteCompletedUnreachable

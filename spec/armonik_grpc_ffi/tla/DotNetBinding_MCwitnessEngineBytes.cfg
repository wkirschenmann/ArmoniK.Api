\* Witness configuration: the target is stated negatively in
\* DotNetBinding_MCwitnessEngineBytes, so the run is EXPECTED to report a
\* violation - the trace is the evidence that the engine takes bytes and gives
\* them back under the binding.
\* No DebtSurvivesToShutdown constraint here: it prunes returned buffers, and
\* the path this witness needs does not matter to it either way.

INIT Init
NEXT Next

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}
    Ceiling          = 3
    HardCeiling      = 4
    OneRequestCalls  = {}
    OneResponseCalls = {}

\* TLC cannot parse a function literal in a constant assignment.
CONSTANT MessageLength <- MC_MessageLength

\* TLC enumerates the received pairs over a finite index set.
CONSTANT PayloadIndices <- [FfiGrpc] MC_PayloadIndices

\* TLC cannot resolve doubly-instantiated variable tuples: the tuple
\* definitions inside the instantiated FfiGrpc are overridden with flat
\* lists, and the local l1_vars with the same.
CONSTANT l0_vars <- [FfiGrpc] MC_l0_vars
CONSTANT ffi_vars <- [FfiGrpc] MC_ffi_vars
CONSTANT vars <- [FfiGrpc] MC_l1_vars
CONSTANT l1_vars <- MC_l1_vars

CONSTRAINT StateConstraint

CHECK_DEADLOCK FALSE

PROPERTY
    EngineNeverGivesBackBytes

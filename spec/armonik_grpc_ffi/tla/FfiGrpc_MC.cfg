SPECIFICATION Spec

CONSTANTS
    Messages    = {m1}
    CallIds     = {call1}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}
    MaxSendsInFlight = 1
    DeliveryCredits  = 1
    BufferIds        = {b1, b2}

\* TLC cannot resolve the instantiated L0!vars inside ENABLED.
CONSTANT l0_vars <- MC_l0_vars

\* TLC expands the per-payload fairness family over a finite index set.
CONSTANT PayloadIndices <- MC_PayloadIndices

\* SYMMETRY disabled for liveness checking (TLC warning: symmetry can miss liveness violations)
\* SYMMETRY Symmetry

\* Bound otherwise-unbounded abstract message streams for finite exploration.
CONSTRAINT StateConstraint

INVARIANT
    TypeOK
    AbstractSafety

PROPERTY
    AbstractSpec
    EventualTerminal
    EventualShutdown
    MCSubmitProgress
    MCDeliveryProgress
    EventualMetadata
    CancellationCompletes
    MCSendsEventuallyAcquitted
    PayloadsEventuallyConsumed
    ShutdownEventEmitted

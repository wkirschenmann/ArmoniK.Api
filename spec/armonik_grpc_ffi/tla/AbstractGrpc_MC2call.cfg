SPECIFICATION Spec

CONSTANTS
    Messages    = {}
    CallIds     = {call1, call2}
    ChannelIds  = {ch1}
    RuntimeIds  = {rt1}

\* Two calls, no message content: exercises the cross-call structure
\* (ChannelFinishClosing comprehensions, the RuntimeRelease guard, the
\* per-call status machinery) without the payload blowup; MESSAGE events
\* are covered by the two-message configuration.
CONSTRAINT StateConstraint

INVARIANT
    SafetyInvariant

PROPERTY
    EventualTerminal
    EventualShutdown
    MCSubmitProgress
    MCDeliveryProgress
    EventualMetadata
